## Append the placeholder '${dm_smbios_extra}' to the generated kernel command
## line, so a boot-tester can inject extra kernel cmdline through the real
## firmware -> GRUB -> kernel chain via 'qemu -smbios'
## ('dm-qemu --smbios-append') with no image edit. The reader that fills this
## variable is emitted by /etc/grub.d/01_smbios-reader; with no SMBIOS string set
## it stays empty and this is a no-op.
##
## This is sourced by grub-mkconfig, so it survives every 'update-grub' (e.g. on a
## kernel update), unlike a direct edit of the generated /boot/grub/grub.cfg. The
## '\$' keeps '${dm_smbios_extra}' literal in the generated grub.cfg: grub-mkconfig
## expands the cmdline variables only once (it does not recurse), so GRUB itself
## expands the placeholder at boot.
## Cope up with "set -o nounset", as 30_serial_console.cfg does.
: "${GRUB_CMDLINE_LINUX_DEFAULT:=""}" || echo "$0: Setting default GRUB_CMDLINE_LINUX_DEFAULT failed! Please report this bug!" >&2

## Appended to GRUB_CMDLINE_LINUX_DEFAULT, not GRUB_CMDLINE_LINUX: grub-mkconfig emits
## "${GRUB_CMDLINE_LINUX} ${GRUB_CMDLINE_LINUX_DEFAULT}", so only the latter puts the
## placeholder LAST on the kernel command line. An injected parameter must win over the
## image's own, and the kernel takes the last occurrence -- from GRUB_CMDLINE_LINUX the
## injection is followed by "loglevel=0 quiet", which silently defeats an injected
## loglevel. Recovery entries drop GRUB_CMDLINE_LINUX_DEFAULT and so are not injectable,
## which is correct: the tester boots default entries.
GRUB_CMDLINE_LINUX_DEFAULT="$GRUB_CMDLINE_LINUX_DEFAULT \${dm_smbios_extra}"
