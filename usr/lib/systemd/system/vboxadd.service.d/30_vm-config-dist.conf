## VirtualBox Guest Additions installs this unit generated from an LSB init
## script, without a virtualization condition. Only run it under VirtualBox.

## The GA-generated unit is Type=oneshot, Restart=no, TimeoutSec=5min: it builds the
## Guest Additions kernel modules and starts VBoxService ONCE. Under heavy host-CPU
## contention a single-vCPU hardened boot can exceed that timeout and FAIL with no
## retry, leaving the Guest Additions permanently down (Additions run level 0, no
## dynamic display resize). Self-heal: re-attempt on failure. Restart=on-failure IS
## valid for Type=oneshot (only always/on-success are rejected, and a clean exit is
## never restarted, so once the GA is up it stops). The StartLimit bounds it so a FAST
## genuine failure (e.g. a module that cannot build -- fails in seconds) gives up after
## a few tries, while a SLOW timeout failure (5min apart, the contention case) keeps
## retrying until the load eases.

[Unit]
ConditionVirtualization=oracle
StartLimitIntervalSec=600
StartLimitBurst=5

[Service]
Restart=on-failure
RestartSec=20
