## VirtualBox does not support SPICE: https://www.virtualbox.org/ticket/13042
[Unit]
ConditionVirtualization=|kvm
ConditionVirtualization=|qemu

## Alternative root fix (disabled by default): spice-vdagentd is pointless
## without a SPICE vdagent channel, and without one it logs
## "Error getting active session: No data available" on every boot that has no
## graphical session (e.g. sysmaint). Gating on the port node stops it running
## when no SPICE channel is attached. Left commented because it changes behavior
## on real SPICE VMs; the benign message is handled by a systemcheck
## journal_ignore_patterns_list entry instead. To exercise this path in the boot
## test, add a vdagent port to the qemu invocation, e.g.:
##   -device virtio-serial \
##   -chardev spicevmc,id=vdagent,name=vdagent \
##   -device virtserialport,chardev=vdagent,name=com.redhat.spice.0
#ConditionPathExists=/dev/virtio-ports/com.redhat.spice.0
