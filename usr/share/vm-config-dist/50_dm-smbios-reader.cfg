## Turns on the GRUB SMBIOS cmdline reader for BOOT-TEST images.
##
## NOT installed into /etc/default/grub.d by this package. derivative-maker's
## build-steps.d/3500_install-packages copies it there only under
## '--smbios-reader true'; a released image never receives it, so
## etc/grub.d/01_smbios-reader and etc/default/grub.d/99_smbios-cmdline.cfg both
## stay inert and the image carries no reader at all.
##
## The reader turns a firmware-supplied string into kernel command line, and the
## kernel command line is the part of the boot chain Secure Boot does not
## authenticate. That is why it is opt-in rather than merely gated.
GRUB_ENABLE_DM_SMBIOS_READER="true"
